<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  /* Un solo mundo visual, el de las diapositivas: fondo noche, violeta NoxCut y ámbar de los títulos. */
  --bg: #0f0f17;
  --panel: #171724;
  --ink: #ecebf5;
  --muted: #9a98b3;
  --accent: #8b7bff;
  --amber: #f5a524;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 14px 20px 6px; }
header h1 { font-family: var(--display); font-size: 1.25rem; letter-spacing: .08em; color: var(--accent); margin: 0; }
header p { margin: 0; color: var(--muted); font-size: .95rem; text-wrap: balance; }
main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 16px; }
.stage { position: relative; width: min(100%, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border-radius: 10px;
  background: var(--panel); box-shadow: 0 10px 40px rgba(0, 0, 0, .45); opacity: 0; transition: opacity .25s; }
.stage img.on { opacity: 1; }
.side { position: absolute; top: 0; bottom: 0; width: 30%; background: none; border: 0; cursor: pointer; }
.side.prev { left: 0; }
.side.next { right: 0; }
nav { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px 16px; }
button.ctl { font: 600 .95rem var(--body); color: var(--ink); background: var(--panel); border: 1px solid #2c2b42;
  border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.ctl:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 4.5em; text-align: center; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; background: #34334d; cursor: pointer; }
.dots button[aria-current="true"] { background: var(--amber); }
@media (prefers-reduced-motion: reduce) { .stage img { transition: none; } }
@media (max-width: 500px) { header p { font-size: .85rem; } .dots { display: none; } }
</style>
</head>
<body>

  </div>
</main>
<nav>
  <button class="ctl" id="prev">← Anterior</button>
  <span class="count" id="count" aria-live="polite"></span>
  <button class="ctl" id="next">Siguiente →</button>
  <div class="dots" id="dots"></div>
  <button class="ctl" id="full">Pantalla completa</button>
</nav>
<script>
const slides = [...document.querySelectorAll(".stage img")];
const dots = document.getElementById("dots");
slides.forEach((_, i) => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", "Ir a la diapositiva " + (i + 1));
  b.addEventListener("click", () => show(i));
  dots.appendChild(b);
});
let current = 0;
function show(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle("on", k === current));
  [...dots.children].forEach((d, k) => d.setAttribute("aria-current", k === current));
  document.getElementById("count").textContent = (current + 1) + " / " + slides.length;
  const want = "#diapositiva-" + (current + 1);
  if (location.hash !== want) history.replaceState(null, "", want);
}
function fromHash() {
  const m = /^#diapositiva-(\d+)$/.exec(location.hash);
  show(m ? Number(m[1]) - 1 : 0);
}
document.getElementById("prev").onclick = document.getElementById("sidePrev").onclick = () => show(current - 1);
document.getElementById("next").onclick = document.getElementById("sideNext").onclick = () => show(current + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { show(current + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { show(current - 1); e.preventDefault(); }
});
let x0 = null;
const stage = document.getElementById("stage");
stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
  x0 = null;
});
document.getElementById("full").onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await stage.requestFullscreen();
  } catch (err) {
    document.getElementById("full").textContent = "Pantalla completa no disponible";
  }
};
window.addEventListener("hashchange", fromHash);
fromHash();
</script>

</html>
